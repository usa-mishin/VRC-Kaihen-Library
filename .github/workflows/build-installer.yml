name: Build installer

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part version (for example 1.0.72.0)'
        required: true
        default: '1.0.72.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: VrcKaihenLibrary/packages.lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        env:
          WORKFLOW_VERSION: ${{ inputs.version }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:WORKFLOW_VERSION
          } else {
            $version = $env:TAG_VERSION.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid four-part version: $version"
          }
          $installer = .\scripts\Build-ExeInstaller.ps1 -Version $version -Platform x64
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $hashFile = Join-Path (Split-Path -Parent $installer) "$(Split-Path -Leaf $installer).sha256"
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath $hashFile -Encoding ascii

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Kaihen-Library-installer
          path: |
            artifacts/installer/*-setup.exe
            artifacts/installer/*.sha256
          if-no-files-found: error
